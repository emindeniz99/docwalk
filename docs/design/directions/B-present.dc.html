<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>docwalk, Stage: presenting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b8381a}a:hover{color:#8f2b13}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; display: grid; grid-template-rows: 1fr auto; background: #15171c; font-family: Inter, system-ui, sans-serif;">
  <main style="display: grid; place-items: center; padding: 40px;">
    <article style="width: min(100%, 1280px); aspect-ratio: 16 / 9; background: #ffffff; color: #17181c; border-radius: 14px; padding: 72px 88px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.45);">
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #5c5e66;">
        <span style="width: 28px; height: 3px; background: {{accent}};"></span>
        Ledgerline: payment ledger redesign
      </div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; letter-spacing: -0.03em; line-height: 0.98; max-width: 900px;">Proposed architecture</h1>
      <p style="margin: 0; font-size: 24px; line-height: 1.5; color: #3d3f47; max-width: 960px;">Ledgerline splits the system into a write path that appends events and a read path that serves projections. The outbox pattern moves events from the database to the stream without a distributed transaction.</p>
      <figure style="margin: auto 0 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
        <div style="padding: 14px 18px; border-radius: 10px; background: #f4f4f2; font-weight: 600; font-size: 18px;">Command API</div>
        <svg width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><path d="M0 7h34M28 1l6 6-6 6" fill="none" stroke="#17181c" stroke-width="2"></path></svg>
        <div style="padding: 14px 18px; border-radius: 10px; background: #f4f4f2; font-weight: 600; font-size: 18px;">Journal + outbox</div>
        <svg width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><path d="M0 7h34M28 1l6 6-6 6" fill="none" stroke="#17181c" stroke-width="2"></path></svg>
        <div style="padding: 14px 18px; border-radius: 10px; background: #17181c; color: #ffffff; font-weight: 600; font-size: 18px;">ledger.events</div>
        <svg width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><path d="M0 7h34M28 1l6 6-6 6" fill="none" stroke="#17181c" stroke-width="2"></path></svg>
        <div style="padding: 14px 18px; border-radius: 10px; background: #f4f4f2; font-weight: 600; font-size: 18px;">Projectors</div>
        <figcaption style="width: 100%; font-size: 14px; color: #5c5e66;">Diagram shown at 26%, too small to read here. Press Enter or click to explore it full screen.</figcaption>
      </figure>
    </article>
  </main>
  <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 28px 20px; color: #b9bcc6;">
    <div aria-label="Sections" style="display: flex; gap: 4px; flex: 1; min-width: 280px;">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="12">
        <span title="{{s.title}}" style="{{s.style}}"></span>
      </sc-for>
    </div>
    <span style="font-size: 14px; color: #ffffff; font-weight: 600;">8 / 47</span>
    <div style="display: flex; gap: 6px;">
      <button type="button" aria-label="Pen" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a3d47; background: #22252d; color: #e9eaee;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg></button>
      <button type="button" aria-label="Laser pointer" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a3d47; background: #22252d; color: #e9eaee;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
      <button type="button" aria-label="Overview" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a3d47; background: #22252d; color: #e9eaee;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></button>
      <button type="button" aria-label="Open presenter window" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a3d47; background: #22252d; color: #e9eaee;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="14" height="10"></rect><path d="M18 8h4v10H8v-2"></path></svg></button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e5532d","options":["#e5532d","#3b5bfd","#0f9d76"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#e5532d';
    const names = ['Summary', 'Goals', 'Glossary', 'Current architecture', 'Problems', 'Proposed architecture', 'Lifecycle', 'Request flow', 'Data model', 'API', 'Idempotency', 'Failure handling', 'Flags', 'Migration', 'Rollout', 'Observability', 'Security', 'Alternatives'];
    return {
      accent,
      sections: names.map((title, i) => ({
        title,
        style: 'flex: 1; height: 4px; border-radius: 2px; background: ' + (i < 5 ? '#8d909a' : i === 5 ? accent : '#3a3d47') + ';'
      }))
    };
  }
}
</script>
</body>
</html>
