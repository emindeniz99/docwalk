# Node's exact version lives in .tool-versions, which mise and CI's
# setup-node both read; package.json's `devEngines.runtime` only gates a
# range, so tools that bring their own Node (Dependabot) are not refused.
# pnpm's version lives in package.json (`packageManager`).
[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
